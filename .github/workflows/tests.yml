name: Plugin regression tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['dify_plugin==0.9.0', 'dify_plugin>=0.9.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyyaml '${{ matrix.sdk }}'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q main.py provider tools
      - name: Package with release workflow CLI
        run: |
          curl --fail --location --retry 3 https://github.com/langgenius/dify-plugin-daemon/releases/download/0.0.6/dify-plugin-linux-amd64 -o "$RUNNER_TEMP/dify-plugin"
          chmod +x "$RUNNER_TEMP/dify-plugin"
          "$RUNNER_TEMP/dify-plugin" plugin package . -o "$RUNNER_TEMP/tongyi_aigc-0.0.5.difypkg"
          python scripts/verify_package.py "$RUNNER_TEMP/tongyi_aigc-0.0.5.difypkg"
